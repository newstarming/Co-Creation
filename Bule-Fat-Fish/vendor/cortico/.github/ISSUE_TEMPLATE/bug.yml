name: Bug report / 问题报告
description: Something behaves wrong. One problem per issue. / 行为不对。一个 issue 只报一个问题。
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened / 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 期望的行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: run-lines
    attributes:
      label: Run directory lines / 运行目录日志
      description: |
        For a bot misbehaving at runtime, paste the relevant lines from `data/runs/<run>/`. Remove keys first.
        bot 运行时出错请贴 `data/runs/<run>/` 里的相关行,不要截图。贴之前删掉密钥。
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or npm version / commit 或 npm 版本
    validations:
      required: true
  - type: textarea
    id: release-diff
    attributes:
      label: Diff against the release / 与对应 Release 的 diff
      description: |
        In your checkout, run `git diff <tag>` against the Pal-AI-Lab/Cortico release your code is based on, for example `git diff v0.1.11 > release-diff.txt`, and drop the file here. Write `none` if you run the npm package or an unmodified release.
        在你的检出里对代码所基于的 Pal-AI-Lab/Cortico Release 跑 `git diff <tag>`,例如 `git diff v0.1.11 > release-diff.txt`,把文件拖进来。用 npm 包或没改过的 Release 就写「无」。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version / 操作系统与 Node 版本
      placeholder: Windows 11, Node 22.14
